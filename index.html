<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X1aooooooooH · Minecraft 工具</title>
<meta name="description" content="Minecraft 基岩版工具入口。当前项目是 BlockFlow，后续工具会继续加入。">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="./blockflow/textures/favicon.ico">
<style>
  :root{
    color-scheme:light;
    --bg:#f5f5f7;
    --surface:#ffffff;
    --surface-2:#f0f1f3;
    --ink:#1d1d1f;
    --muted:#6e6e73;
    --faint:#8e8e93;
    --line:rgba(60,60,67,.16);
    --line-strong:rgba(60,60,67,.28);
    --accent:#0071e3;
    --accent-ink:#ffffff;
    --focus:rgba(0,113,227,.35);
    --nav:rgba(245,245,247,.78);
    --shadow:0 18px 50px rgba(0,0,0,.08);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#000000;
    --surface:#1c1c1e;
    --surface-2:#2c2c2e;
    --ink:#f5f5f7;
    --muted:#aeaeb2;
    --faint:#8e8e93;
    --line:rgba(255,255,255,.14);
    --line-strong:rgba(255,255,255,.26);
    --accent:#2997ff;
    --accent-ink:#ffffff;
    --focus:rgba(41,151,255,.4);
    --nav:rgba(0,0,0,.72);
    --shadow:0 22px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html{background:var(--bg);scroll-behavior:smooth}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  .shell{width:min(980px,calc(100% - 48px));margin:0 auto}
  .nav{position:fixed;z-index:20;top:0;left:0;right:0;height:52px;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line)}
  .nav-inner{height:52px;display:flex;align-items:center;gap:22px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:14px;white-space:nowrap}
  .mark{display:flex;align-items:center;gap:2px;width:24px;flex:0 0 24px}
  .mark i{display:block;width:5px;height:5px;border:1px solid var(--ink);border-radius:1px}
  .mark i:nth-child(2),.mark i:nth-child(3){background:var(--ink)}
  .nav-links{display:flex;align-items:center;gap:20px;margin-left:auto;font-size:13px;color:var(--muted)}
  .nav-links a:hover{color:var(--ink)}
  .theme{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer}
  .theme:hover{background:var(--surface-2);color:var(--ink)}
  .theme svg{width:15px;height:15px}
  .theme-moon{display:none}
  [data-theme="dark"] .theme-sun{display:none}
  [data-theme="dark"] .theme-moon{display:block}
  main{padding:104px 0 28px}
  .hero{padding:20px 0 44px}
  .eyebrow{margin:0 0 12px;font:10px/1.4 var(--mono);letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
  h1{margin:0;font-size:clamp(40px,7vw,68px);line-height:1.03;letter-spacing:-.045em;font-weight:600}
  .hero p{max-width:560px;margin:18px 0 0;color:var(--muted);font-size:16px;line-height:1.65}
  .hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--faint);font:11px/1.4 var(--mono)}
  .projects{padding-top:8px}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 4px 10px}
  .section-head h2{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.02em;font-weight:600}
  .section-head span{font:10px/1.4 var(--mono);color:var(--faint)}
  .search{display:flex;align-items:center;gap:8px;margin:0 4px 12px;padding:0 12px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--faint)}
  .search svg{width:14px;height:14px;flex:0 0 14px}
  .search input{width:100%;border:0;background:transparent;color:var(--ink);font:13px/1 var(--font);outline:none}
  .search input::placeholder{color:var(--faint)}
  .project-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .project-row{display:grid;grid-template-columns:34px 132px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:relative;transition:background-color .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
  .project-row:last-of-type{border-bottom:0}
  .project-row:hover{background:var(--surface-2);transform:translateY(-1px)}
  .project-index{font:10px/1 var(--mono);color:var(--faint)}
  .project-thumb{display:block;width:132px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
  .project-thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.22,1,.36,1)}
  .project-row:hover .project-thumb img{transform:scale(1.025)}
  .project-copy{display:flex;flex-direction:column;gap:5px;min-width:0}
  .project-title{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .project-title b{font-size:17px;font-weight:600;letter-spacing:-.02em}
  .project-title em{font:9.5px/1.4 var(--mono);font-style:normal;color:var(--accent);letter-spacing:.04em}
  .project-description{color:var(--muted);font-size:12.5px;line-height:1.55;max-width:58ch}
  .project-tags{display:flex;gap:6px;flex-wrap:wrap}
  .project-tags span{font:9px/1 var(--mono);color:var(--faint);padding:3px 5px;border:1px solid var(--line);border-radius:4px}
  .project-meta{display:flex;align-items:center;gap:12px;color:var(--faint);font:10px/1.4 var(--mono);white-space:nowrap}
  .project-status{color:var(--accent)}
  .project-arrow{font-size:16px;color:var(--faint);transition:transform .3s cubic-bezier(.22,1,.36,1),color .2s ease}
  .project-row:hover .project-arrow{transform:translateX(4px);color:var(--accent)}
  .project-more{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 18px;background:var(--surface-2);font-size:12px;color:var(--muted)}
  .project-more a{color:var(--accent);font-weight:500}
  .project-more a:hover{text-decoration:underline}
  .empty{padding:22px 18px;color:var(--faint);font-size:13px}
  .empty[hidden]{display:none}
  footer{padding:56px 0 30px;color:var(--faint);font:10px/1.6 var(--mono)}
  .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding-top:16px}
  .footer-links{display:flex;gap:16px}
  .footer-links a:hover{color:var(--ink)}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hero,.section-head,.search,.project-list{animation:enter .6s cubic-bezier(.22,1,.36,1) both}
  .section-head{animation-delay:.08s}.search{animation-delay:.12s}.project-list{animation-delay:.16s}
  @media(max-width:760px){
    .shell{width:min(100% - 32px,980px)}
    main{padding-top:88px}
    .project-row{grid-template-columns:26px 92px minmax(0,1fr);gap:12px;padding:14px}
    .project-thumb{width:92px}
    .project-meta{grid-column:2/4;justify-content:flex-start;gap:10px;padding-top:4px}
    .project-description{font-size:12px}
  }
  @media(max-width:480px){
    .nav-links{gap:14px;font-size:12px}
    h1{font-size:42px}
    .hero p{font-size:14px}
    .project-row{grid-template-columns:1fr;gap:8px;padding:14px}
    .project-index{order:1}
    .project-thumb{order:2;grid-column:1;width:100%;margin-top:4px}
    .project-copy{order:3;width:100%}
    .project-meta{order:4;grid-column:1;width:100%;justify-content:flex-start}
    .project-title b{font-size:17px}
    .project-title em{white-space:normal}
    .project-more{font-size:11px;align-items:flex-start;flex-direction:column;gap:5px}
    .footer-inner{flex-direction:column;align-items:flex-start;gap:8px}
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .hero,.section-head,.search,.project-list{animation:none}
    .project-row,.project-thumb img,.project-arrow{transition:none}
  }
</style>
</head>
<body>
<header class="nav">
  <div class="shell nav-inner">
    <a class="brand" href="#top"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>X1aooooooooH</a>
    <nav class="nav-links" aria-label="站点">
      <a href="#projects">项目</a>
      <a href="https://github.com/X1aooooooooH" target="_blank" rel="noreferrer">GitHub</a>
      <button id="themeToggle" class="theme" type="button" aria-label="切换外观" title="切换外观">
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4Z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="top">
  <div class="shell">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">Project index</p>
      <h1 id="hero-title">Minecraft 工具与实验</h1>
      <p>我做的 Minecraft 基岩版工具。每个项目独立部署，共用这个入口；当前项目是 BlockFlow，后续会继续加入。</p>
      <div class="hero-meta"><span>01 个项目</span><span>独立部署</span><span>浏览器本地</span></div>
    </section>

    <section class="projects" id="projects" aria-labelledby="projects-title">
      <div class="section-head"><h2 id="projects-title">项目</h2><span id="projectCount">—</span></div>
      <label class="search" for="projectSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="projectSearch" type="search" placeholder="搜索项目、标签或描述" autocomplete="off">
      </label>
      <div id="projectList" class="project-list" aria-live="polite"></div>
      <p id="projectEmpty" class="empty" hidden>没有匹配的项目。</p>
      <div class="project-more"><span>后续工具会继续加入这个入口。</span><a href="https://github.com/X1aooooooooH" target="_blank" rel="noreferrer">在 GitHub 查看实验 →</a></div>
    </section>

    <footer>
      <div class="footer-inner">
        <span>© 2026 X1aooooooooH · Minecraft Bedrock tools</span>
        <div class="footer-links"><a href="https://github.com/X1aooooooooH" target="_blank" rel="noreferrer">源码</a><a href="./blockflow/README.md">BlockFlow 文档</a></div>
      </div>
    </footer>
  </div>
</main>

<script type="module" src="./src/root.js"></script>
<script>
  (() => {
    const root = document.documentElement;
    const button = document.getElementById('themeToggle');
    const saved = localStorage.getItem('nav-theme');
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = saved || (dark ? 'dark' : 'light');
    button?.addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('nav-theme', root.dataset.theme);
    });
  })();
</script>
</body>
</html>
