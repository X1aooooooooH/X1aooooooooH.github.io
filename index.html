<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<meta name="description" content="BlockFlow Minecraft Bedrock 工具集">
<title>BlockFlow</title>
<link rel="icon" href="./assets/icons/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="./css/global.css?v=2.12.2-ui">
<link rel="stylesheet" href="./css/home.css?v=2.12.2-ui">
</head>
<body><div class="shell">
<header class="header"><a class="brand" href="./"><img src="./assets/icons/favicon.ico" alt=""><span>BlockFlow</span></a><span class="header-note">Minecraft Bedrock 编辑工具</span></header>
<main><section class="intro"><div class="eyebrow">工作区</div><h1>选择编辑器</h1><p>选择要使用的工具。所有文件均在本地浏览器中处理，不会上传到服务器。</p></section>
<section class="tools" aria-label="编辑器列表">
<a class="tool" href="./CommandEditor/"><div class="tool-top"><span class="tool-icon">⌘</span><span class="tool-index">01 / COMMAND</span></div><h2>命令链编辑器</h2><p>识别和编辑命令链、断链与自闭链，支持命令内容修改、批量替换及 MCStructure 导出。</p><div class="tool-bottom"><span>打开命令链编辑器</span><span class="arrow">↗</span></div></a>
<a class="tool" href="./StructureEditor/"><div class="tool-top"><span class="tool-icon">⬡</span><span class="tool-index">02 / STRUCTURE</span></div><h2>结构编辑器</h2><p>在三维视图中查看和编辑方块、状态与命令方块数据，仅支持 Minecraft Bedrock .mcstructure 导入与导出。</p><div class="tool-bottom"><span>打开结构编辑器</span><span class="arrow">↗</span></div></a>
</section></main>
<footer class="footer"><span>BlockFlow</span><span>本地处理 · 无需上传</span></footer>
</div></body></html>
